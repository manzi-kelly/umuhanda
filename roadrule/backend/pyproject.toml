[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roadrules-api"
version = "0.1.0"
description = "Road Rules API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "PyMuPDF>=1.26,<2",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the isolated roadrules_test PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

